<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-header-bg: #007bff;
        --color-primary: #007bff;
        --color-success: #28a745;
        --color-card-bg: white;
        --color-card-selected: #d1ffd1;
        --color-details-bg : #e3e3e3e6;
        --color-card-deselected: #fff;
        --shadow-light: 2px 2px 8px rgba(0, 0, 0, 0.1);
        --shadow-strong: 4px 4px 12px rgba(0, 0, 0, 0.2);

        --color-dark-text: #fff;
        --color-dark-bg: #222;
      }
      /* Dark Theme */

      body.dark {
        background-color: var(--color-dark-bg);
        color: var(--color-dark-text);

        --color-header-bg: #333;
        --color-card-bg: #222;
        --color-card-selected: #333;
        --color-card-dark: #fff;
        --color-card-deselected: #222;
        --color-details-bg : #333333ee;
      }

      /* Navigation bar */

      .navbar {
        background-color: var(--color-header-bg);
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: var(--shadow-strong);
        width: 100%;
      }

      .navbar-toggle {
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        align-self: flex-end;
      }

      .navbar-links {
        flex-direction: column;
        width: 100%;
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease-in-out;
      }

      .navbar-links.open {
        max-height: 500px;
      }

      .navbar-links li {
        width: 100%;
      }

      .nav-link {
        color: white;
        font-weight: bold;
        text-decoration: none;
        padding: 15px;
        display: block;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: opacity 0.3s;
      }

      .nav-link:hover {
        opacity: 0.7;
      }

      /* Desktop Styles */

      @media (min-width: 600px) {
        .navbar {
          flex-direction: row-reverse;
          justify-content: space-between;
          align-items: center;
        }

        .navbar-toggle {
          display: none;
        }

        .navbar-controls {
          width: auto !important;
        }

        .navbar-links {
          display: flex;
          flex-direction: row;
          gap: 20px;
          width: auto;
          max-height: none;
          overflow: visible;
        }
        .navbar-links.open {
          max-height: none;
        }

        .navbar-links li {
          width: auto;
        }

        .nav-link {
          padding: 10px;
          border-bottom: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="script.js"></script>
  </body>
</html>
