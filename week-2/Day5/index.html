<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .navbar {
        background-color: var(--color-primary);
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: var(--shadow-strong);
        width: 100%;
      }

      .navbar-brand {
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        margin-bottom: 10px;
      }

      .navbar-toggle {
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        align-self: flex-end;
      }

      .navbar-links {
        display: none;
        flex-direction: column;
        width: 100%;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .navbar-links.open {
        display: flex;
      }

      .navbar-links li {
        width: 100%;
      }

      .navbar-links a {
        color: white;
        text-decoration: none;
        padding: 15px;
        display: block;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: opacity 0.3s;
      }

      .navbar-links a:hover {
        opacity: 0.8;
      }

      /* Desktop Styles */
      
      @media (min-width: 600px) {
        .navbar {
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
        }

        .navbar-toggle {
          display: none;
        }

        .navbar-links {
          display: flex !important;
          flex-direction: row;
          gap: 20px;
          width: auto;
        }

        .navbar-links li {
          width: auto;
        }

        .navbar-links a {
          padding: 10px;
          border-bottom: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="script.js"></script>
  </body>
</html>
