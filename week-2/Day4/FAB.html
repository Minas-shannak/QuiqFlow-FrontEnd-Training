<!-- 1 - Use different CSS positioning techniques to create a floating action button. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title aria-label="floating action button">FAB</title>
    <style>
      :root {
        --fab-size: 56px;
        --fab-radius: 20%;
        --fab-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        --fab-font-size: 24px;
        --fab-cursor: pointer;
        --fab-bottom: 20px;
        --fab-right: 20px;

        --color-absolute: #03dac6;
        --color-fixed: #6200ee;
        --color-sticky: #ff4081;
      }

      body {
        height: 2000px;
      }

      .absolute-fab {
        position: absolute;
        bottom: var(--fab-bottom);
        right: var(--fab-right);
        width: var(--fab-size);
        height: var(--fab-size);
        border-radius: var(--fab-radius);
        background-color: var(--color-absolute);
        color: black;
        border: none;
        box-shadow: var(--fab-shadow);
        cursor: var(--fab-cursor);
        font-size: var(--fab-font-size);
      }

      .fixed-fab {
        position: fixed;
        bottom: var(--fab-bottom);
        right: var(--fab-right);
        width: var(--fab-size);
        height: var(--fab-size);
        border-radius: var(--fab-radius);
        background-color: var(--color-fixed);
        color: white;
        border: none;
        box-shadow: var(--fab-shadow);
        cursor: var(--fab-cursor);
        font-size: var(--fab-font-size);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .Sticky-fab {
        position: sticky;
        float: right;
        top: calc(100vh - 76px);
        width: var(--fab-size);
        height: var(--fab-size);
        margin-right: var(--fab-right);
        border-radius: var(--fab-radius);
        background-color: var(--color-sticky);
        color: white;
        border: none;
        box-shadow: var(--fab-shadow);
        cursor: var(--fab-cursor);
        font-size: var(--fab-font-size);
      }

      button:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <p>click change button to change the FAB positioning techniques</p>
    <button id="change">change</button>
    <button id="FAB" class="absolute-fab">+</button>
    <p class="display-position">the position is fixed</p>

    <script>
      const fabClasses = ["fixed-fab", "absolute-fab", "Sticky-fab"];
      let changingButton = document.getElementById("change");
      let fabButton = document.getElementById("FAB");
      let displayPosition = document.querySelector(".display-position");
      let currentIndex = 0;

      changingButton.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % fabClasses.length;
        fabButton.classList = fabClasses[currentIndex];
        displayPosition.textContent = `The position is ${fabClasses[currentIndex].replace("-fab", "")}`;
      });
    </script>
  </body>
</html>
